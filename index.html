<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            cursor: pointer;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .tip {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-family: sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>


    <img id="display-image" src="" alt="image">
    <div class="tip">press switch slides</div>

    <script>
       
        const images = [
            '1.png',
            '2.png',
            '3.png'
        ];

        let currentIndex = 0;
        const imgElement = document.getElementById('display-image');

        function showImage(index) {
            imgElement.src = images[index];
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        }

        showImage(currentIndex);

    
        document.addEventListener('keydown', nextImage);

    
        document.addEventListener('click', nextImage);
    </script>
</body>
</html>
